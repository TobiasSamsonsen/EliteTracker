# The Predict job (docs/predict.md): syncs fixtures to Firestore, snapshots the model's odds
# at kick-off, scores settled rounds, builds the leaderboards, erases deletion requests.
#
# Hourly once this file is on main (the rules and indexes are deployed). A manual run is a
# dry run unless `live` is ticked; a scheduled run is always live.
#
# Auth is keyless: google-github-actions/auth exchanges this run's GitHub OIDC token for a
# short-lived access token of predict-sync@elitetrackerno.iam.gserviceaccount.com (only
# roles/datastore.user), through the Workload Identity pool `github`, which admits this
# repository only. There is no key file and no secret.

name: Predict sync

on:
  workflow_dispatch:
    inputs:
      live:
        description: "Write to Firestore and commit (unticked: a dry run that only prints)"
        type: boolean
        default: false
  schedule:
    - cron: "7 * * * *"        # hourly, a few minutes past to stay clear of refresh.yml

permissions:
  contents: write
  id-token: write   # the OIDC token for Workload Identity

concurrency:
  group: predict
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # As in refresh.yml: the push below uses the PAT so that deploy.yml fires.
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/914037628709/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: predict-sync@elitetrackerno.iam.gserviceaccount.com
          token_format: access_token

      - name: Run the job
        env:
          FIRESTORE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.live }}" != "true" ]; then
            python -m elitetracker.predict_sync --dry-run
          else
            python -m elitetracker.predict_sync
          fi

      - name: Commit the anonymous aggregates and the calendar feed
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.live }}
        env:
          PAT: ${{ secrets.REFRESH_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/predict public/predict/rounds.ics; then
            echo "Nothing to commit."
            exit 0
          fi
          git add data/predict public/predict/rounds.ics
          git commit -m "Predict sync: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin main
          git push https://${PAT}@github.com/${{ github.repository }}.git HEAD:main
