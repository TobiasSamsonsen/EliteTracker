# Scheduled refresh of the current-season match data, off the developer's machine.
#
# Started every 15 minutes from cron-job.org (docs/operations.md, "Starting the refresh on time"); this
# schedule is only the net under that, once a day (06:07 UTC, which is also inside the hour in which the
# guard asks about a match that is long overdue). GitHub's own "hourly" cron ran about 4 times a day in
# November 2026, so it is no longer relied on; the refresh guard in elitetracker.refresh skips leagues
# whose normalized file already has no unplayed match whose result is due (100 minutes after kick-off;
# a match 12 hours overdue is asked about only at 06 and 18 UTC), so fotmob is only hit when there
# are results to pick up. Days with no new results
# produce no diff, so no commit and no deploy happen.
#
# Note: GitHub Actions schedule triggers are best-effort and routinely delayed
# by 1–2+ hours.  The guard means the delay only affects freshness, not
# correctness — it reads the existing data and checks kickoff times, not the
# clock.

name: Scheduled data refresh

on:
  schedule:
    - cron: "7 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Don't persist the GITHUB_TOKEN: checkout's Authorization extraheader
          # overrides the PAT in the push URL, so the push would authenticate as
          # GITHUB_TOKEN and GitHub would not fire the push event for deploy.yml.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Refresh current-season results from fotmob
        run: python -m elitetracker.refresh

      - name: Commit and push if data changed
        env:
          PAT: ${{ secrets.REFRESH_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/normalized data/xg.json; then
            echo "No match-data changes; nothing to commit."
            exit 0
          fi
          git add data/normalized data/xg.json
          git commit -m "Scheduled refresh: update $(date -u +%Y-%m-%d) match results"
          git pull --rebase --autostash origin main
          git push https://${PAT}@github.com/${{ github.repository }}.git HEAD:main
