# Scheduled refresh of the current-season match data, off the developer's machine.
#
# Runs daily; fetches the latest results from fotmob (no API key), normalizes and
# validates them, and -- if anything changed -- commits the updated
# data/normalized files and pushes with REFRESH_PAT. That push re-triggers the
# existing firebase-hosting-merge.yml, which rebuilds (only the current season on
# a cache hit) and deploys to Firebase. Days with no new results produce no diff,
# so no commit and no deploy happen.

name: Scheduled data refresh

on:
  schedule:
    # 21:30 UTC == 23:30 CEST / 22:30 CET: every Norwegian matchday is done by then.
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Refresh current-season results from fotmob
        run: python -m elitetracker.refresh

      - name: Commit and push if data changed
        env:
          PAT: ${{ secrets.REFRESH_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/normalized; then
            echo "No match-data changes; nothing to commit."
            exit 0
          fi
          git add data/normalized
          git commit -m "Scheduled refresh: update $(date -u +%Y-%m-%d) match results"
          git pull --rebase --autostash origin main
          git push https://x-access-token:${PAT}@github.com/${{ github.repository }}.git HEAD:main
