# Scheduled refresh of the current-season match data, off the developer's machine.
#
# Runs every 30 minutes; the refresh guard in elitetracker.refresh skips leagues
# whose normalized file already has no unplayed matches with a past kickoff, so
# fotmob is only hit when there are results to pick up. Days with no new results
# produce no diff, so no commit and no deploy happen.
#
# Note: GitHub Actions schedule triggers are best-effort and routinely delayed
# by 1–2+ hours.  The guard means the delay only affects freshness, not
# correctness — it reads the existing data and checks kickoff times, not the
# clock.

name: Scheduled data refresh

on:
  schedule:
    - cron: "0,30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Refresh current-season results from fotmob
        run: python -m elitetracker.refresh

      - name: Commit and push if data changed
        env:
          PAT: ${{ secrets.REFRESH_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/normalized; then
            echo "No match-data changes; nothing to commit."
            exit 0
          fi
          git add data/normalized
          git commit -m "Scheduled refresh: update $(date -u +%Y-%m-%d) match results"
          git pull --rebase --autostash origin main
          git push https://x-access-token:${PAT}@github.com/${{ github.repository }}.git HEAD:main
