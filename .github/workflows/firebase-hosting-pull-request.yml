# Preview channel for a PR. Same build as the merge workflow: past seasons come
# from the `past-seasons` release asset, CI simulates only the current season.

name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .
          echo "CURRENT=$(python -c 'from elitetracker.pipeline import current_season; print(current_season())')" >> "$GITHUB_ENV"
      - name: Fetch prebuilt past-season reports
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p public/data
          if gh release download past-seasons --pattern past-seasons.tar.gz --dir "$RUNNER_TEMP"; then
            tar -xzf "$RUNNER_TEMP/past-seasons.tar.gz" -C public/data
            echo "past seasons: $(ls public/data | wc -l) files"
          else
            echo "::warning::No past-seasons release asset -- only $CURRENT will be browsable."
          fi
      - name: Build the current season
        run: python -m elitetracker.build_site --only-season "$CURRENT"
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ELITETRACKERNO }}
          projectId: elitetrackerno
