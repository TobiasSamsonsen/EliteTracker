# Full Python and browser-JS test suite on pull requests and pushes to main.
# Keeps script/stylesheet integrity, i18n parity, and Python/JS model parity
# green on every change (unlike deploy.yml, which only builds and deploys).

name: Tests

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'data/predict/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Python test suite
        run: python -m pytest -q

      - name: Frontend Node test suite
        run: node --test tests/frontend.test.js tests/predict.test.js tests/predict-ui.test.js
