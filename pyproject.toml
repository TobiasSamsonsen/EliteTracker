[project]
name = "elitetracker"
version = "0.1.0"
description = "ELO-based prediction and ranking for Eliteserien and OBOS-ligaen (2026 season)"
requires-python = ">=3.11"

# No runtime dependencies: fotmob needs no API key, so fetching uses
# urllib.request and everything downstream uses the standard library.
# tzdata is the exception: Windows ships no IANA tz database, and
# zoneinfo.ZoneInfo("Europe/Oslo") needs it to assign kickoffs to a matchday.
# curl_cffi is needed for Sofascore which blocks non-browser TLS fingerprints.
# numpy runs the season Monte Carlo as arrays (simulation.season): the
# simulation is ~98% of building a report, and as a pure-Python loop it made a
# rewound view 6.6 s; vectorised it is 1.7 s, and a past season builds in
# 40-45 s instead of 91 s here. Standard-library Python cannot vectorise; numpy
# is one widely used package with wheels for every platform CI runs on.
dependencies = [
    "tzdata; sys_platform == 'win32'",
    "curl-cffi>=0.7",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "playwright>=1.40"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
