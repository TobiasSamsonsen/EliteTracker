[project]
name = "elitetracker"
version = "0.1.0"
description = "ELO-based prediction and ranking for Eliteserien and OBOS-ligaen (2026 season)"
requires-python = ">=3.11"

# No runtime dependencies: fotmob needs no API key, so fetching uses
# urllib.request and everything downstream uses the standard library.
# tzdata is the exception: Windows ships no IANA tz database, and
# zoneinfo.ZoneInfo("Europe/Oslo") needs it to assign kickoffs to a matchday.
dependencies = ["tzdata; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
