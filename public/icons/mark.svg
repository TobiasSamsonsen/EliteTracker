<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The mark: a corner of the finish grid. The diagonal is each club's
       likeliest place, its neighbours fainter, and the top left -- the
       title -- in the electric blue. Source of the favicon and, through
       tools/brand/render.mjs, every PNG icon and the share image. -->
  <rect width="32" height="32" rx="7" fill="#080f1c"/>
  <g fill="#e8edf5">
    <rect x="5.5" y="5.5" width="6" height="6" rx="1.2" fill="#1f5eff"/>
    <rect x="13" y="5.5" width="6" height="6" rx="1.2" opacity=".35"/>
    <rect x="20.5" y="5.5" width="6" height="6" rx="1.2" opacity=".1"/>
    <rect x="5.5" y="13" width="6" height="6" rx="1.2" opacity=".35"/>
    <rect x="13" y="13" width="6" height="6" rx="1.2"/>
    <rect x="20.5" y="13" width="6" height="6" rx="1.2" opacity=".35"/>
    <rect x="5.5" y="20.5" width="6" height="6" rx="1.2" opacity=".1"/>
    <rect x="13" y="20.5" width="6" height="6" rx="1.2" opacity=".35"/>
    <rect x="20.5" y="20.5" width="6" height="6" rx="1.2"/>
  </g>
</svg>
