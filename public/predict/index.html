<!doctype html>
<html lang="nb" data-lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Predict — EliteTracker</title>
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<link rel="canonical" href="https://elitetracker.no/predict/">
<meta name="description" content="Gi dine egne sjanser for kampene i Eliteserien og OBOS-ligaen, og se om du slår modellen.">
<meta name="theme-color" content="#080f1c" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#e8edf5" media="(prefers-color-scheme: light)">
<meta property="og:title" content="Predict — EliteTracker">
<meta property="og:description" content="Gi dine egne sjanser for kampene i Eliteserien og OBOS-ligaen, og se om du slår modellen.">
<meta property="og:image" content="https://elitetracker.no/og.png">
<meta property="og:url" content="https://elitetracker.no/predict/">
<meta name="color-scheme" content="light dark">
<script>
  /* Theme and language as on the rest of the site, so the choices carry over. */
  (function () {
    try {
      var choice = localStorage.getItem('elitetracker-theme');
      document.documentElement.dataset.resolvedTheme = choice === 'light' || choice === 'dark' ? choice
        : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      var language = localStorage.getItem('lang') === 'en' ? 'en' : 'no';
      document.documentElement.dataset.lang = language;
      document.documentElement.lang = language === 'en' ? 'en' : 'nb';
    } catch (error) {
      document.documentElement.dataset.resolvedTheme = 'light';
    }
  })();
</script>
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/predict.css">
</head>
<body>
<div class="shell doc predict">
  <nav class="doc__top">
    <a href="/" data-t="predict.back">← EliteTracker</a>
    <div class="switch" role="group" aria-label="Språk / Language">
      <button type="button" data-lang="no" aria-pressed="true">NO</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </nav>

  <header class="doc__head">
    <h1 data-t="predict.title">Predict</h1>
    <p class="ptagline" data-t="predict.tagline">Gi dine egne sjanser for kampene i Eliteserien og OBOS-ligaen, og se om du slår modellen.</p>
    <a class="phowlink" href="#how" data-t="predict.how.link">Slik spiller du</a>
  </header>

  <div id="predict-note" role="status" aria-live="polite"></div>
  <div id="predict-tabs" class="ptabs"></div>
  <div class="playout">
    <main id="predict-view" aria-live="polite"><p class="pload" data-t="predict.loading">Laster …</p></main>
    <aside id="predict-side" class="pside"></aside>
  </div>
  <noscript><p>Predict trenger JavaScript. / Predict needs JavaScript.</p></noscript>

  <footer class="doc__foot">

  </footer>
</div>
